# Dependabot update configuration.
#
# Security updates are on by default for this public repository and do not need
# a config file. What they need is grouping: without it Dependabot opens one
# pull request per advisory, and a single ecosystem can produce dozens at once.
# Every one of those then has to clear the code-owner review that branch
# protection requires on `main`, which is how a routine patch turns into an
# afternoon.
#
# So each directory below declares a single catch-all group with
# `applies-to: security-updates` and sets `open-pull-requests-limit: 0`. In
# Dependabot v2:
#   - `open-pull-requests-limit: 0` disables routine non-security version-update
#     sweeps (which otherwise churn intentionally pinned runtimes such as
#     `google-adk==2.1.0` or Express 4 -> 5 without running container smoke
#     tests in repo CI), while keeping `groups` and `ignore` active for
#     Dependabot security updates.
#   - `applies-to: security-updates` is required on each group because `groups`
#     default to `version-updates` when omitted.
#
# `directories` with a glob is deliberately avoided: an explicit list makes it
# obvious when a new service is added and goes uncovered.
#
# Every entry also sets a `cooldown`, which zizmor's `insufficient-cooldown`
# audit requires and which is worth having on its own terms: it stops
# Dependabot adopting a release the moment it is published, so a compromised
# package has to survive a few days of public scrutiny before it can reach a
# pull request here. The wait scales with how much a bump can break -- 30 days
# for a major, 3 for a patch. This does NOT slow security patching: cooldown
# applies to version updates only, and security updates ignore it.

version: 2

updates:
  # --- npm -----------------------------------------------------------------
  # Both are Vite + React builds. Most of what Dependabot finds here is
  # development-scope build tooling that never reaches a running container:
  # the viewer's runtime stage installs with `npm ci --omit=dev`, and the
  # dashboard ships as a static nginx bundle.
  #
  # `tailwindcss >= 4.0.0` (and its v3 transitive `postcss-selector-parser`)
  # are ignored via `versions` rather than `update-types`: `update-types` only
  # filters version updates, whereas `versions` also filters security updates.
  # Tailwind v3 -> v4 is a CSS-first rewrite (moves the PostCSS plugin to
  # `@tailwindcss/postcss`, replaces `@tailwind` directives with
  # `@import "tailwindcss"`, and drops `tailwind.config.js`), so a manifest-only
  # Dependabot bump breaks `npm run build` while still passing repo CI. Migrate
  # both apps together by hand when ready.
  - package-ecosystem: npm
    directory: /02-demos/molforge/viewer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 0
    groups:
      viewer-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "tailwindcss"
        versions: [">= 4.0.0"]
      - dependency-name: "postcss-selector-parser"

  - package-ecosystem: npm
    directory: /02-demos/molforge/dashboard
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 0
    groups:
      dashboard-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "tailwindcss"
        versions: [">= 4.0.0"]
      - dependency-name: "postcss-selector-parser"

  # --- Python --------------------------------------------------------------
  # One entry per deployable unit. These are pinned to the exact versions
  # verified in the deployed Cloud Run / Reasoning Engine revisions -- see the
  # header of each requirements.txt. `open-pull-requests-limit: 0` with
  # `applies-to: security-updates` ensures Dependabot only opens a grouped PR
  # when a real security advisory requires moving a pin.
  #
  # Caveat worth knowing before trusting a green dashboard here: the render
  # service's *deployed* image is built from Dockerfile.pymol, which resolves
  # its environment through conda. Dependabot cannot read that, so it reports
  # on requirements.txt -- the matplotlib-fallback image -- only. Keep the two
  # in step by hand.
  - package-ecosystem: pip
    directory: /02-demos/molforge/a2a
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 0
    groups:
      a2a-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "google-cloud-aiplatform"

  - package-ecosystem: pip
    directory: /02-demos/molforge/agents/orchestrator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 0
    groups:
      orchestrator-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "google-adk"
      - dependency-name: "google-cloud-aiplatform"

  - package-ecosystem: pip
    directory: /02-demos/molforge/agents/lead_optimizer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 0
    groups:
      lead-optimizer-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "google-adk"
      - dependency-name: "google-cloud-aiplatform"

  - package-ecosystem: pip
    directory: /02-demos/molforge/agents/admet_safety_agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 0
    groups:
      admet-safety-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "google-adk"
      - dependency-name: "google-cloud-aiplatform"

  - package-ecosystem: pip
    directory: /02-demos/molforge/services/render_service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 0
    groups:
      render-service-dependencies:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /02-demos/molforge/services/rdkit_service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 0
    groups:
      rdkit-service-dependencies:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /02-demos/molforge/services/data_retrieval
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 0
    groups:
      data-retrieval-dependencies:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /05-workshops/jax-on-gpu/deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 0
    groups:
      jax-workshop-dependencies:
        applies-to: security-updates
        patterns:
          - "*"

  # --- GitHub Actions ------------------------------------------------------
  # Actions in `.github/workflows/lint.yml` are SHA-pinned to satisfy zizmor's
  # `unpinned-uses` check. Scope this entry to security updates as well.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only `default-days` here: Dependabot rejects the `semver-*-days` keys for
    # the github-actions ecosystem, because actions are referenced by tag
    # rather than by a semver range it can reason about.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      actions:
        applies-to: security-updates
        patterns:
          - "*"
