# ${PROJECT_ID} is NOT resolved by kubectl -- expand it before applying:
#     PROJECT_ID=<your-project> envsubst < infra/gke/data-retrieval-deployment.yaml | kubectl apply -f -
# It was previously hardcoded to the reference deployment's project, so a
# straight `kubectl apply` pulled an image nobody else could read.
# (setup.sh does not use this file -- it generates its manifests inline.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-retrieval-service
  namespace: default
  labels:
    app: data-retrieval-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-retrieval-service
  template:
    metadata:
      labels:
        app: data-retrieval-service
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      containers:
      - name: data-retrieval
        image: us-central1-docker.pkg.dev/${PROJECT_ID}/molforge-repo/molforge-data-retrieval:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: data-retrieval-service
  namespace: default
spec:
  selector:
    app: data-retrieval-service
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
