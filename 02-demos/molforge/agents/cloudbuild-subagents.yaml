# $PROJECT_ID is a Cloud Build built-in substitution -- it resolves to the
# project the build runs in. It was previously hardcoded to the reference
# deployment's project, so this config only worked in that one project.
steps:
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Pins the DEPLOYING CLI (the runtime version comes from each agent's
        # own requirements.txt). aiplatform was unpinned here, so `adk deploy`
        # itself ran against whatever resolved that day.
        pip install "google-adk==2.1.0" "google-cloud-aiplatform[agent_engines]==2.1.0"
        cd /workspace
        # Fail the BUILD, not the runtime. .env is gitignored (setup.sh
        # regenerates it) and only reaches here because .gcloudignore does not
        # include .gitignore. Without it the deploy SUCCEEDS and the engine then
        # fails to start, which reads as an ADK problem rather than a missing
        # file. Assert the file and the one variable that must be in it.
        for a in lead_optimizer admet_safety_agent; do
          test -f "agents/$a/.env" \
            || { echo "agents/$a/.env missing from the build context -- check .gcloudignore" >&2; exit 1; }
          grep -q '^GOOGLE_CLOUD_PROJECT=.\+' "agents/$a/.env" \
            || { echo "agents/$a/.env has no GOOGLE_CLOUD_PROJECT -- the agent will not boot" >&2; exit 1; }
        done
        echo "=== deploying Lead Optimizer ==="
        adk deploy agent_engine agents/lead_optimizer \
          --display_name "MolForge Lead Optimizer" \
          --project $PROJECT_ID \
          --region us-central1
        echo "=== deploying ADMET Safety Agent ==="
        adk deploy agent_engine agents/admet_safety_agent \
          --display_name "MolForge ADMET Safety Agent" \
          --project $PROJECT_ID \
          --region us-central1
timeout: 3600s
options:
  machineType: 'E2_HIGHCPU_8'
