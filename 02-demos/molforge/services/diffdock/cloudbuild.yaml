# $PROJECT_ID is a Cloud Build built-in substitution -- it resolves to the
# project the build runs in. It was previously hardcoded to the reference
# deployment's project, so this config only worked in that one project.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'echo "$$NGC_API_KEY" | docker login nvcr.io --username=\$oauthtoken --password-stdin'
    secretEnv: ['NGC_API_KEY']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/molforge-repo/molforge-diffdock:latest'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/molforge-repo/molforge-diffdock:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/ngc-api-key/versions/latest
      env: 'NGC_API_KEY'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
