apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jax-workspace-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard-rwo
---
apiVersion: v1
kind: Pod
metadata:
  name: jax-jupyter
  labels:
    app: jax-jupyter
spec:
  containers:
  - name: jax
    image: nvcr.io/nvidia/jax:26.04-maxtext-py3
    workingDir: /workspace
    command: ["bash", "-lc"]
    args:
    - |
      python -m pip install --no-cache-dir \
        --requirement /opt/jax-workshop/requirements-workshop.txt &&
      python /opt/jax-workshop/verify_environment.py &&
      jupyter lab --ip=0.0.0.0 --port=8884 --no-browser --allow-root \
        --ServerApp.root_dir=/workspace
    ports:
    - containerPort: 8884
      name: jupyter
    - containerPort: 6006
      name: tensorboard
    resources:
      # Request all GPUs on the node. Adjust if you changed gpu_count in
      # terraform/variables.tf (e.g. "4" for g2-standard-48).
      limits:
        nvidia.com/gpu: "2"
        memory: "48Gi"
        cpu: "12"
      requests:
        nvidia.com/gpu: "2"
        memory: "24Gi"
        cpu: "6"
    env:
    - name: LD_LIBRARY_PATH
      value: /usr/local/nvidia/lib64:/opt/nvidia/cudnn/lib
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: shm
      mountPath: /dev/shm
    - name: workshop-environment
      mountPath: /opt/jax-workshop
      readOnly: true
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: jax-workspace-pvc
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
  - name: workshop-environment
    configMap:
      name: jax-workshop-environment
  restartPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  name: jax-jupyter-svc
spec:
  type: LoadBalancer
  selector:
    app: jax-jupyter
  ports:
  - port: 8884
    targetPort: 8884
    name: jupyter
